# Postgres local somente para metadados operacionais.
# Nenhum dado extraído de PDF deve ser gravado neste banco.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas
      POSTGRES_DB: veritas_ai
    ports:
      - "5433:5432"
    volumes:
      - veritas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veritas_pg_data:
