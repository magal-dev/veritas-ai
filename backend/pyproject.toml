[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-ai-backend"
version = "0.1.0"
description = "Backend FastAPI do Veritas AI — extração processual para PJe-Calc (TCC)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "google-genai>=1.0.0",
  "openpyxl>=3.1.5",
  "pendulum>=3.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "pipeline*", "models*", "repositories*", "services*", "schemas*", "core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "scripts/*", "alembic/*"]

[tool.coverage.report]
# Piso para o CI: cobertura não pode cair abaixo disso.
fail_under = 85
skip_covered = true
show_missing = true
