name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR/branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  privacy:
    name: Privacidade (arquivos sensíveis)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Bloquear PDFs e .env versionados
        # Processos trabalhistas têm CPF e salários: nenhum PDF ou .env entra no repositório.
        run: |
          found=$(git ls-files | grep -iE '\.pdf$|(^|/)\.env$' || true)
          if [ -n "$found" ]; then
            echo "::error::Arquivos sensíveis versionados:"
            echo "$found"
            exit 1
          fi

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      # Testes nunca chamam o Gemini real nem dependem de Postgres.
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Verificar sintaxe
        run: python -m compileall -q api core models pipeline repositories schemas services scripts main.py
      - name: Testes e cobertura
        # fail_under em pyproject.toml: o job falha se a cobertura cair abaixo do piso.
        run: pytest -q --cov --cov-report=term --junitxml=pytest-report.xml
      - name: Resumo no GitHub
        if: always() && matrix.python == '3.13'
        run: |
          {
            echo "## Testes do backend"
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-report.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          tests, failures, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print(f"**{tests - failures - errors - skipped} passaram**, {failures} falharam, {errors} erros, {skipped} pulados ({float(suite.get('time', 0)):.1f}s)")
          PY
            echo
            echo "## Cobertura"
            coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veritas
          POSTGRES_PASSWORD: veritas
          POSTGRES_DB: veritas_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veritas -d veritas_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://veritas:veritas@127.0.0.1:5432/veritas_ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependências
        run: pip install -e .
      - name: Ida e volta das migrations
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Typecheck e build
        run: npm run build
      - name: Publicar build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
